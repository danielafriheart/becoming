<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Becoming | The Personal Performance Audit</title>
  <desc id="description">A private, evidence-based year in review. Why did the 2026 version of me produce these results?</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#292929"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <linearGradient id="card" x2="0" y2="1">
      <stop stop-color="#171717"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="titleFill" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="64" y="58" width="1072" height="514" rx="28" fill="url(#card)" stroke="#333"/>
  <path d="M100 59h1000" stroke="#fff" stroke-opacity=".45"/>
  <g transform="translate(104 95)">
    <rect width="64" height="64" rx="15" fill="#18181b" stroke="#393939"/>
    <g transform="translate(8 8) scale(2.67)" fill="#fff">
      <circle cx="18" cy="5" r="2"/>
      <path d="M3 20 8 7l5 7 4-4 4 10Z"/>
    </g>
    <text x="84" y="42" fill="#f2f2f2" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="650" letter-spacing="-0.6">Becoming</text>
  </g>
  <text x="104" y="244" fill="#a3a3a3" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3.2">THE PERSONAL PERFORMANCE AUDIT</text>
  <text x="100" y="344" fill="url(#titleFill)" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-3.6">Why did the 2026</text>
  <text x="100" y="421" fill="url(#titleFill)" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-3.6">version of me produce</text>
  <text x="100" y="498" fill="url(#titleFill)" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-3.6">these results?</text>
  <path d="M104 530h992" stroke="#333"/>
  <text x="104" y="555" fill="#8a8a8a" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing=".4">A private, evidence-based year in review.</text>
</svg>
